name: Test spill og kampeffekter

on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'licenses/**'
      - 'build.mjs'
      - 'package.json'
      - 'tools/test/**'
      - '.github/workflows/kampeffekter.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test tools/test/combatfx.test.mjs tools/test/atlas.test.mjs tools/test/campaign.test.mjs
      - run: node tools/test/combatfx-browser.mjs dist/combatfx-test
      - run: node tools/test/texture-fallback.mjs
      - run: node tools/test/texture-browser.mjs dist/index.html dist/teksturer/etter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kampeffekter-test
          path: dist/combatfx-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teksturer-test
          path: dist/teksturer/etter

  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tools/test/atlas-browser.mjs dist/atlas-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdensatlas-test
          path: dist/atlas-test

  kampanje:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tools/test/campaign-browser.mjs dist/kampanje-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kampanje-test
          path: dist/kampanje-test

  lyd:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tools/test/audio-browser.mjs dist/lydtest
      - run: node tools/test/harbor-shot.mjs dist/arno-bilder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyd-og-arno-test
          path: |
            dist/lydtest
            dist/arno-bilder
