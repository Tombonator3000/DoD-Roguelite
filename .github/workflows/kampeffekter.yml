name: Test spill og kampeffekter

on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'build.mjs'
      - 'package.json'
      - 'tools/test/**'
      - '.github/workflows/kampeffekter.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test tools/test/combatfx.test.mjs
      - run: node tools/test/combatfx-browser.mjs dist/combatfx-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kampeffekter-test
          path: dist/combatfx-test
